
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Autorizzazione Revolut</title>
</head>
<body>
  <h2>Autorizzazione Revolut</h2>
  <p id="status">Controllo autorizzazione...</p>
  <button id="copy" hidden>Copia codice</button>

  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    history.replaceState(null, "", location.pathname);

    const status = document.getElementById("status");
    const button = document.getElementById("copy");

    if (error) {
      status.textContent = "Autorizzazione non riuscita.";
    } else if (code && state) {
      status.textContent =
        "Autorizzazione ricevuta. Conserva il codice in privato.";
      button.hidden = false;

      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          status.textContent = "Codice copiato.";
        } catch {
          status.textContent = "Impossibile copiare il codice.";
        }
      });
    } else {
      status.textContent =
        "Pagina pronta. In attesa dell'autorizzazione.";
    }
  </script>
</body>
</html>
