<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avvio autorizzazione Revolut</title>
</head>
<body>
<h2>Collegamento Revolut</h2>
<p>Incolla il link di autorizzazione e il valore State mostrati dall'esecuzione privata di GitHub Actions. Non condividere questi valori con nessuno.</p>
<label for="authUrl">Link di autorizzazione</label><br>
<input id="authUrl" type="url" autocomplete="off" spellcheck="false" style="width:100%;max-width:700px"><br><br>
<label for="state">State di verifica</label><br>
<input id="state" type="text" autocomplete="off" spellcheck="false" style="width:100%;max-width:700px"><br><br>
<button id="start" type="button">Avvia autorizzazione</button>
<p id="status" role="status"></p>
<script>
document.getElementById("start").addEventListener("click", () => {
  const status = document.getElementById("status");
  const raw = document.getElementById("authUrl").value.trim();
  const state = document.getElementById("state").value.trim();
  try {
    const url = new URL(raw);
    if (url.protocol !== "https:") throw new Error("Il link deve iniziare con https://");
    if (!state || state.length < 12) throw new Error("Inserisci lo State generato da GitHub Actions.");
    // Conservato soltanto in questa scheda, per la verifica in callback.html.
    sessionStorage.setItem("expected_state", state);
    status.textContent = "Reindirizzamento al servizio di autorizzazione...";
    window.location.assign(url.href);
  } catch (error) {
    status.textContent = error.message;
  }
});
</script>
</body>
</html>
